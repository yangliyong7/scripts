<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>雅思真正超纲词 · 108 词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1d212b;--line:#262b36;
  --tx:#e8ecf2;--tx2:#98a2b3;--tx3:#667085;
  --ac:#5b8cff;--ac2:#7aa2ff;--ok:#3ecf8e;--warn:#f5a623;--gd:#ffd166;
}
html,body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--ac2);text-decoration:none}

/* ===== 顶部 ===== */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(15,17,21,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px 14px 0;
}
.hd-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#5b8cff,#9b6cff);
  display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.5px;
}
.hd-tt{flex:1;min-width:0}
.hd-tt h1{font-size:16px;font-weight:700;letter-spacing:-.2px}
.hd-tt p{font-size:11.5px;color:var(--tx3);margin-top:1px}
.badge{
  flex:none;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;
  background:rgba(91,140,255,.15);color:var(--ac2);border:1px solid rgba(91,140,255,.3);
}

/* 进度条 */
.prog-wrap{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.prog-bar{flex:1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.prog-fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog-tx{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-tx b{color:var(--ok);font-weight:700}

/* 搜索 */
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--tx3);fill:none;stroke-width:2}
.search input{
  width:100%;padding:10px 34px 10px 34px;border-radius:10px;
  background:var(--card2);border:1px solid var(--line);color:var(--tx);
  font-size:14px;outline:none;transition:border-color .2s;
}
.search input:focus{border-color:var(--ac)}
.search input::placeholder{color:var(--tx3)}
.clr{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;background:var(--line);
  display:none;place-items:center;font-size:13px;color:var(--tx2);cursor:pointer;line-height:1;
}
.clr.on{display:grid}

/* 筛选 chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);
  cursor:pointer;transition:.18s;white-space:nowrap;
}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip .n{opacity:.65;font-weight:500;margin-left:3px;font-size:11px}

/* ===== 主体 ===== */
main{padding:14px 14px 40px}
.summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;
}
.sum-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;text-align:center;
}
.sum-card .v{font-size:19px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sum-card .k{font-size:11px;color:var(--tx3);margin-top:2px}
.sum-card.a .v{color:var(--ac2)}
.sum-card.b .v{color:var(--gd)}
.sum-card.c .v{color:var(--ok)}

/* 分组标题 */
.grp-hd{
  display:flex;align-items:center;gap:8px;
  margin:20px 0 9px;padding-left:2px;
}
.grp-hd:first-child{margin-top:0}
.grp-hd .dot{width:3px;height:14px;border-radius:2px;background:var(--ac)}
.grp-hd h2{font-size:14px;font-weight:700;letter-spacing:-.1px}
.grp-hd .cnt{font-size:11.5px;color:var(--tx3);font-weight:500}
.grp-hd.sub .dot{background:var(--gd);height:11px}
.grp-hd.sub h2{font-size:12.5px;color:var(--tx2);font-weight:600}

/* 词条网格 */
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}

.word{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;cursor:pointer;transition:.16s;
  display:flex;align-items:flex-start;gap:10px;position:relative;
  -webkit-user-select:none;user-select:none;
}
.word:active{transform:scale(.985)}
.word.done{background:rgba(62,207,142,.07);border-color:rgba(62,207,142,.3)}
.word.done .w-en{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(62,207,142,.5)}

/* 勾选框 */
.chk{
  flex:none;width:19px;height:19px;border-radius:6px;margin-top:1px;
  border:1.5px solid var(--line);background:var(--card2);
  display:grid;place-items:center;transition:.16s;
}
.word.done .chk{background:var(--ok);border-color:var(--ok)}
.chk svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.16s}
.word.done .chk svg{opacity:1}

.w-body{flex:1;min-width:0}
.w-en{
  font-size:15.5px;font-weight:650;letter-spacing:-.2px;
  color:var(--tx);word-break:break-word;line-height:1.35;
}
.w-ph{
  font-size:11.5px;color:var(--tx3);font-weight:400;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;
  margin-top:1px;letter-spacing:-.1px;
}
.w-tr{
  font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.w-lv{
  flex:none;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;
  background:rgba(255,209,102,.13);color:var(--gd);margin-top:1px;
  white-space:nowrap;
}

/* 空状态 */
.empty{text-align:center;padding:52px 20px;color:var(--tx3)}
.empty .ico{font-size:38px;margin-bottom:10px;opacity:.65}
.empty p{font-size:13.5px}

/* 底部工具条 */
.fab{
  position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px;z-index:60;
}
.fab button{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:rgba(29,33,43,.94);backdrop-filter:blur(12px);
  color:var(--tx);font-size:17px;cursor:pointer;transition:.18s;
  display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.fab button:active{transform:scale(.92)}
.fab button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 提示 toast */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);
  background:rgba(29,33,43,.97);border:1px solid var(--line);
  padding:9px 17px;border-radius:22px;font-size:12.5px;color:var(--tx);
  opacity:0;pointer-events:none;transition:.24s;z-index:99;
  box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 复制弹层 */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  display:none;place-items:center;z-index:100;padding:22px;
}
.modal.on{display:grid}
.modal-box{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:460px;max-height:74vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.modal-hd h3{font-size:14.5px;font-weight:700}
.modal-hd .x{
  width:26px;height:26px;border-radius:8px;background:var(--card2);
  display:grid;place-items:center;cursor:pointer;font-size:15px;color:var(--tx2);
  border:none;line-height:1;
}
.modal-body{padding:14px 16px;overflow:auto;flex:1}
.modal-body textarea{
  width:100%;min-height:220px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;color:var(--tx);font-size:13px;padding:11px;resize:vertical;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;line-height:1.7;outline:none;
}
.modal-ft{display:flex;gap:9px;padding:0 16px 15px}
.modal-ft button{
  flex:1;padding:11px;border-radius:10px;border:none;font-size:13.5px;
  font-weight:650;cursor:pointer;transition:.16s;
}
.modal-ft .pri{background:var(--ac);color:#fff}
.modal-ft .sec{background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.modal-ft button:active{transform:scale(.98)}
</style>
</head>

  var KEY = 'ielts_add_663_v1';

  // 进度
  var done = {};
  try{ done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ done = {}; }
  function saveDone(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }

  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');
  var clrEl = document.getElementById('clr');
  var filterSl = null;   // null=全部, 'ADV', 1..9

  // ===== 统计 =====
  var awlN = DATA.filter(function(d){return d.g==='AWL';}).length;
  var advN = DATA.filter(function(d){return d.g==='ADV';}).length;
  document.getElementById('sAwl').textContent = awlN;
  document.getElementById('sAdv').textContent = advN;
  document.getElementById('progTotal').textContent = DATA.length;
  document.getElementById('cntBadge').textContent = DATA.length;

  // ===== chips =====
  var CHIPS = [{k:null,label:'全部',n:DATA.length}];
  CHIPS.push({k:'ADV',label:'进阶词',n:advN});
  var slCount = {};
  DATA.forEach(function(d){ if(d.g==='AWL' && d.sl) slCount[d.sl]=(slCount[d.sl]||0)+1; });
  Object.keys(slCount).sort().forEach(function(s){
    CHIPS.push({k:Number(s),label:'AWL '+s,n:slCount[s]});
  });

  var chipsEl = document.getElementById('chips');
  CHIPS.forEach(function(c,i){
    var b = document.createElement('button');
    b.className = 'chip' + (i===0?' on':'');
    b.dataset.k = c.k===null ? '' : String(c.k);
    b.innerHTML = c.label + ' <span class="n">' + c.n + '</span>';
    b.onclick = function(){
      Array.prototype.forEach.call(chipsEl.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      filterSl = c.k;
      render();
    };
    chipsEl.appendChild(b);
  });

  // ===== 渲染 =====
  function filtered(){
    var q = qEl.value.trim().toLowerCase();
    return DATA.filter(function(d){
      if(filterSl === 'ADV'){ if(d.g !== 'ADV') return false; }
      else if(typeof filterSl === 'number'){ if(d.g!=='AWL' || d.sl !== filterSl) return false; }
      if(!q) return true;
      return d.w.toLowerCase().indexOf(q) >= 0 || (d.tr||'').toLowerCase().indexOf(q) >= 0;
    });
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function render(){
    var arr = filtered();
    if(!arr.length){
      listEl.innerHTML = '<div class="empty"><div class="ico">🔍</div><p>没有匹配的单词</p></div>';
      return;
    }
    var html = '';
    var lastGrp = null, lastSl = null;

    arr.forEach(function(d){
      // 分组标题
      if(d.g === 'AWL'){
        if(lastGrp !== 'AWL'){
          html += '<div class="grp-hd"><span class="dot"></span><h2>AWL 学术词</h2><span class="cnt">'
                + awlN + ' 词 · 按 sublist 排序</span></div>';
          lastGrp = 'AWL'; lastSl = null;
        }
        if(d.sl !== lastSl){
          html += '<div class="grp-hd sub"><span class="dot"></span><h2>Sublist ' + d.sl + '</h2></div>';
          lastSl = d.sl;
        }
      } else {
        if(lastGrp !== 'ADV'){
          html += '<div class="grp-hd"><span class="dot"></span><h2>进阶词</h2><span class="cnt">'
                + advN + ' 词</span></div>';
          lastGrp = 'ADV'; lastSl = null;
        }
      }

      var isDone = !!done[d.w];
      html += '<div class="word' + (isDone?' done':'') + '" data-w="' + esc(d.w) + '">'
            +   '<div class="chk"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>'
            +   '<div class="w-body">'
            +     '<div class="w-en">' + esc(d.w) + '</div>'
            +     (d.ph ? '<div class="w-ph">/' + esc(d.ph) + '/</div>' : '')
            +     '<div class="w-tr">' + esc(d.tr || '—') + '</div>'
            +   '</div>'
            +   (d.g==='AWL' && d.sl ? '<div class="w-lv">AWL ' + d.sl + '</div>' : '')
            + '</div>';
    });

    listEl.innerHTML = html;
  }

  // 点击词条切换
  listEl.addEventListener('click', function(e){
    var card = e.target.closest('.word');
    if(!card) return;
    var w = card.dataset.w;
    if(done[w]) delete done[w]; else done[w] = 1;
    card.classList.toggle('done');
    saveDone(); updateStats();
  });

  // ===== 进度 =====
  function updateStats(){
    var n = Object.keys(done).length;
    document.getElementById('progDone').textContent = n;
    document.getElementById('sDone').textContent = n;
    var pct = DATA.length ? (n / DATA.length * 100) : 0;
    document.getElementById('progFill').style.width = pct.toFixed(1) + '%';
  }

  // ===== 搜索 =====
  var timer = null;
  qEl.addEventListener('input', function(){
    clrEl.classList.toggle('on', !!qEl.value);
    clearTimeout(timer);
    timer = setTimeout(render, 130);
  });
  clrEl.onclick = function(){
    qEl.value = ''; clrEl.classList.remove('on'); render(); qEl.focus();
  };

  // ===== toast =====
  var toastEl = document.getElementById('toast');
  var tTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1700);
  }

  // ===== 弹层 =====
  var modal = document.getElementById('modal');
  var mText = document.getElementById('mText');
  var mTitle = document.getElementById('mTitle');
  function openModal(title, text){
    mTitle.textContent = title;
    mText.value = text;
    modal.classList.add('on');
  }
  document.getElementById('mClose').onclick = function(){ modal.classList.remove('on'); };
  document.getElementById('mCancel').onclick = function(){ modal.classList.remove('on'); };
  modal.onclick = function(e){ if(e.target === modal) modal.classList.remove('on'); };

  // ===== 复制清单 =====
  document.getElementById('btnCopy').onclick = function(){
    // 只复制还没收录的
    var rest = DATA.filter(function(d){ return !done[d.w]; });
    if(!rest.length){ toast('全部收录完成 🎉'); return; }
    var lines = rest.map(function(d){
      return d.w + (d.tr ? '\t' + d.tr : '');
    });
    openModal('复制待收录清单（' + rest.length + ' 词）', lines.join('\n'));
  };

  document.getElementById('mCopy').onclick = function(){
    mText.select();
    mText.setSelectionRange(0, 999999);
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(!ok && navigator.clipboard){
      navigator.clipboard.writeText(mText.value).then(function(){
        toast('已复制'); modal.classList.remove('on');
      }).catch(function(){ toast('请长按全选后复制'); });
      return;
    }
    if(ok){ toast('已复制 ' + mText.value.split('\n').length + ' 行'); modal.classList.remove('on'); }
    else toast('请长按全选后复制');
  };

  // ===== 重置 =====
  document.getElementById('btnReset').onclick = function(){
    var n = Object.keys(done).length;
    if(!n){ toast('还没有收录记录'); return; }
    if(!confirm('确定重置全部 ' + n + ' 个已收录标记？')) return;
    done = {}; saveDone(); render(); updateStats();
    toast('已重置');
  };

  // ===== 回到顶部 =====
  document.getElementById('btnTop').onclick = function(){
    window.scrollTo({top:0, behavior:'smooth'});
  };

  // ===== 初始化 =====
  render();
  updateStats();
})();
</script>
